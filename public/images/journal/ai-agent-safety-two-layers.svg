<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700"><rect width="1400" height="700" rx="28" fill="#F7F7F4"/><text x="700" y="90" fill="#040A30" font-family="Georgia" font-size="40" text-anchor="middle">Two layers of agent safety</text><line x1="700" y1="150" x2="700" y2="580" stroke="#040A30" opacity=".2"/><g fill="#040A30" font-family="Arial"><text x="350" y="190" font-size="25" text-anchor="middle">WRONG ACTION</text><text x="1050" y="190" font-size="25" text-anchor="middle">WRONG ANSWER</text><text x="140" y="280" font-size="23">• Least privilege</text><text x="140" y="340" font-size="23">• Sandboxing</text><text x="140" y="400" font-size="23">• Approval gates</text><text x="140" y="460" font-size="23">• Identity &amp; access</text><text x="840" y="280" font-size="23">• Trusted sources</text><text x="840" y="340" font-size="23">• Access-aware retrieval</text><text x="840" y="400" font-size="23">• Citations</text><text x="840" y="460" font-size="23">• Human escalation</text></g><rect x="500" y="580" width="400" height="70" rx="35" fill="#040A30"/><text x="700" y="623" fill="#F7F7F4" font-family="Arial" font-size="21" text-anchor="middle">SAFE SYSTEM AROUND THE MODEL</text></svg>